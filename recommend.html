<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Travel AI</title>
</head>
<body class="bg-light">
    <div class="container text-center py-5">
        <h1 class="display-4 fw-bold mb-4">🌍 Where to Next?</h1>
        <p class="lead mb-5">Select a city you loved, and we'll suggest your next adventure.</p>
        <div class="col-md-6 mx-auto card shadow p-4">
            <form action="/recommend" method="POST">
                <select name="city" class="form-select form-select-lg mb-3">
                    {% for city in cities %}
                    <option value="{{ city }}">{{ city }}</option>
                    {% endfor %}
                </select>
                <button type="submit" class="btn btn-primary btn-lg w-100">Find Recommendations</button>
            </form>
        </div>
    </div>
</body>
</html>
